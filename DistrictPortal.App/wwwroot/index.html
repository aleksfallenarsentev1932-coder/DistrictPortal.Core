<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Районный Портал Взаимопомощи</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --danger-color: #f43f5e;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #334155;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 20px;
        }

        .search-bar {
            width: 300px;
            position: relative;
        }

            .search-bar input {
                width: 100%;
                padding: 10px 15px;
                background-color: var(--card-bg);
                border: 1px solid #334155;
                border-radius: 8px;
                color: #fff;
                box-sizing: border-box;
            }

        .main-layout {
            display: flex;
            gap: 25px;
            max-width: 1200px;
            width: 100%;
            align-items: flex-start;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 300px;
            flex-shrink: 0;
        }

        .panel {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

            .panel h3 {
                margin-top: 0;
                margin-bottom: 15px;
                font-size: 16px;
                border-bottom: 1px solid #334155;
                padding-bottom: 8px;
            }

        .categories-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .tag-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

            .tag-btn.active, .tag-btn:hover {
                background-color: var(--accent-color);
                color: #fff;
                border-color: var(--accent-color);
            }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            color: var(--text-muted);
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            background-color: var(--input-bg);
            border: 1px solid #475569;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
        }

        button.primary-btn {
            width: 100%;
            padding: 10px;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .profile-skills {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }

        .skill-badge {
            background-color: #475569;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .feed-section {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .post-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .post-category {
            background-color: #334155;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: var(--accent-color);
            font-weight: bold;
        }

        .post-title {
            font-size: 18px;
            font-weight: bold;
            margin: 8px 0;
        }

        .post-content {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 15px;
        }

        .comments-section {
            border-top: 1px solid #334155;
            padding-top: 12px;
            margin-top: 15px;
        }

        .comment {
            background-color: #1e293b;
            border-left: 3px solid var(--accent-color);
            padding: 6px 10px;
            margin-bottom: 8px;
            border-radius: 0 6px 6px 0;
            font-size: 13px;
        }

        .comment-author {
            font-weight: bold;
            color: #fff;
            margin-bottom: 2px;
        }

        .comment-form {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

            .comment-form input {
                flex-grow: 1;
                padding: 6px 10px;
                font-size: 13px;
            }

            .comment-form button {
                padding: 6px 12px;
                background-color: #475569;
                border: none;
                color: #fff;
                border-radius: 6px;
                cursor: pointer;
                font-size: 13px;
            }

        .del-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1 style="margin: 0; font-size: 24px;">Районный Портал</h1>
            <p style="color: var(--text-muted); margin: 3px 0 0 0; font-size: 14px;">Взаимопомощь, услуги и общение</p>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Поиск объявлений..." oninput="filterPosts()">
        </div>
    </header>

    <div class="categories-tags">
        <button class="tag-btn active" onclick="selectCategory('Все', this)">Все объявления</button>
        <button class="tag-btn" onclick="selectCategory('Быт', this)">Бытовые вопросы</button>
        <button class="tag-btn" onclick="selectCategory('Помощь', this)">Помощь соседям</button>
        <button class="tag-btn" onclick="selectCategory('Услуги', this)">Услуги / Работа</button>
        <button class="tag-btn" onclick="selectCategory('Спорт', this)">Спорт / Досуг</button>
    </div>

    <div class="main-layout">
        <div class="sidebar">
            <div class="panel">
                <h3>Мой профиль помощи</h3>
                <div class="form-group">
                    <label>Имя соседа</label>
                    <input type="text" id="profileName" value="София И." onchange="saveProfile()">
                </div>
                <div class="form-group">
                    <label>Мои навыки (через запятую)</label>
                    <input type="text" id="profileSkills" value="Разработка сайтов, C#, Базы данных" onchange="saveProfile()">
                </div>
                <div class="profile-skills" id="skillsList"></div>
            </div>

            <div class="panel">
                <h3>Создать объявление</h3>
                <form id="postForm">
                    <div class="form-group">
                        <label>Категория</label>
                        <select id="postCategory">
                            <option value="Быт">Бытовые вопросы</option>
                            <option value="Помощь">Помощь соседям</option>
                            <option value="Услуги">Услуги / Работа</option>
                            <option value="Спорт">Спорт / Досуг</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Заголовок</label>
                        <input type="text" id="title" required placeholder="Название объявления">
                    </div>
                    <div class="form-group">
                        <label>Текст</label>
                        <textarea id="content" rows="4" required placeholder="Описание..."></textarea>
                    </div>
                    <button type="submit" class="primary-btn">Опубликовать</button>
                </form>
            </div>
        </div>

        <div class="feed-section" id="feed"></div>
    </div>

    <script>
        const API_URL = '/api/posts';
        let allPosts = [];
        let currentCategory = 'Все';

        // 1. ЗАГРУЗКА
        async function loadPosts() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Ошибка сети');
                allPosts = await response.json() || [];
                filterPosts();
            } catch (error) {
                console.error(error);
                document.getElementById('feed').innerHTML = '<p style="color:var(--danger-color)">Ошибка загрузки ленты.</p>';
            }
        }

        // 2. ФИЛЬТРАЦИЯ И ПОИСК (На клиенте в реальном времени)
        function filterPosts() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const feed = document.getElementById('feed');
            feed.innerHTML = '';

            const filtered = allPosts.filter(post => {
                const matchesCategory = currentCategory === 'Все' || (post.category || 'Быт') === currentCategory;
                const text = ((post.title || '') + ' ' + (post.text || post.content || '')).toLowerCase();
                const matchesSearch = text.includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                feed.innerHTML = '<p style="color: var(--text-muted); text-align:center; padding: 20px;">Ничего не найдено.</p>';
                return;
            }

            filtered.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';
                const postText = post.text || post.content || 'Текст отсутствует';
                const postCat = post.category || 'Общее';

                // Рендеринг локальных или демонстрационных комментариев
                let commentsHtml = '';
                if (post.commentsList) {
                    post.commentsList.forEach(c => {
                        commentsHtml += `<div class="comment"><div class="comment-author">${c.author}</div><div>${c.text}</div></div>`;
                    });
                }

                card.innerHTML = `
                        <div class="post-header">
                            <span class="post-category">${postCat}</span>
                            <button class="del-btn" onclick="deletePost(${post.id})">Удалить</button>
                        </div>
                        <div class="post-title">${post.title}</div>
                        <div class="post-content">${postText}</div>

                        <div class="comments-section">
                            <div id="comments-${post.id}">${commentsHtml}</div>
                            <div class="comment-form">
                                <input type="text" id="comment-in-${post.id}" placeholder="Написать комментарий...">
                                <button onclick="addComment(${post.id})">Отправить</button>
                            </div>
                        </div>
                    `;
                feed.appendChild(card);
            });
        }

        // 3. ДОБАВЛЕНИЕ ОБЪЯВЛЕНИЯ
        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const titleInput = document.getElementById('title');
            const contentInput = document.getElementById('content');
            const categorySelect = document.getElementById('postCategory');

            const data = {
                title: titleInput.value,
                content: contentInput.value,
                text: contentInput.value,
                category: categorySelect.value
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (response.ok) {
                    titleInput.value = '';
                    contentInput.value = '';
                    await loadPosts();
                }
            } catch (error) { console.error(error); }
        });

        // 4. ДОБАВЛЕНИЕ КОММЕНТАРИЯ
        async function addComment(postId) {
            const input = document.getElementById(`comment-in-${postId}`);
            if (!input.value.trim()) return;

            const author = document.getElementById('profileName').value;
            const data = { author: author, text: input.value };

            try {
                const response = await fetch(`${API_URL}/${postId}/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    // Локально пушим для мгновенного отображения в лабораторной
                    const post = allPosts.find(p => p.Id === postId || p.id === postId);
                    if (post) {
                        if (!post.commentsList) post.commentsList = [];
                        post.commentsList.push({ author: author, text: input.value });
                    }
                    input.value = '';
                    filterPosts();
                }
            } catch (error) { console.error(error); }
        }

        // 5. УДАЛЕНИЕ ПОСТА
        async function deletePost(id) {
            if (!confirm('Удалить объявление?')) return;
            try {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) await loadPosts();
            } catch (error) { console.error(error); }
        }

        // Переключение категории сверху
        function selectCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterPosts();
        }

        // Логика профиля
        function saveProfile() {
            const skillsInput = document.getElementById('profileSkills').value;
            const container = document.getElementById('skillsList');
            container.innerHTML = '';
            skillsInput.split(',').forEach(s => {
                if (s.trim()) {
                    const b = document.createElement('span');
                    b.className = 'skill-badge';
                    b.innerText = s.trim();
                    container.appendChild(b);
                }
            });
        }

        // Инициализация
        saveProfile();
        loadPosts();
    </script>
</body>
</html>
